# Example only: mDM's 12.5M scale is a reference, not an asserted optimum.
dataset:
  train: 1000000
  valid: 100000
  test: 100000
  seed: 20260911
  teacher_chunk_size: 8192
  teacher_device: cuda:0
  split:
    mode: subject
    formal_mlp: true
    train_subjects: [CYJ, DYZ]
    valid_subjects: [HHZ]
    test_subjects: [HJL]
training:
  device: cuda:0
  seed: 20260911
  epochs: 50
  batch_size: 1024
  learning_rate: 0.001
  scheduler_step_size: 5
  scheduler_gamma: 0.5
  gradient_samples: 64
mlp_loss:
  signal_mse_weight: 1.0
  jacobian_weight: 0.0
  cosine_weight: 0.0
