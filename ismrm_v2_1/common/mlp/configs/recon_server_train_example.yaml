# Example only: do not execute locally. This is online reconstruction, not offline MLP training.
inr:
  coarsest_resolution_mm: 8.0
  finest_resolution_mm: 1.0
  level_scale: 1.5
  n_features_per_level: 2
  log2_hashmap_size: 19
  latent_features: 32
  width: 64
  depth: 3
training:
  device: cuda:0
  seed: 20260911
  spatial_scaling: 30.0
  batch_size: 640
  psf_samples: 8
  checkpoint_every: 0
  require_clean_git: false
  profile_every: 100
  profile_warmup_samples: 2
  monitor_every: 500
  monitor_samples_per_weight_per_stack: 8
  stage_a_iterations: 2000
  stage_b_iterations: 8000
  learning_rates:
    encoding: 0.01
    network: 0.001
    rigid: 0.0001
    variance: 0.0001
    weight_decay: 0.01
  scheduler_milestones: [0.5, 0.8]
  scheduler_gamma: 0.5
loss:
  transformation: 0.001
  quantitative:
    t1: 0.0001
    t2: 0.0001
    b1: 0.001
psf:
  training:
    enabled: true
    type: gaussian
    n_samples: 8
    sampling_mode: random
  export:
    enabled: false
    n_samples: 128
    output_psf_factor: 1.0
variance:
  enabled: false
  pixel: false
  slice: false
  method: experimental_project_heteroscedastic
spatial_regularization:
  n_points: 256
  t1: {mode: TV, weight: 0.0001}
  t2: {mode: TV, weight: 0.0001}
  b1: {mode: TV, weight: 0.001}
  amplitude_guidance: {enabled: false, alpha: 1.0, t1_weight: 0.0, t2_weight: 0.0}
stack_initialization:
  enabled: true
  args_registration: null
bbox:
  mode: training_bbox
  margin_mm: 0.0
export:
  output_resolution_mm: 1.0
  output_batch_size: 65536
decoder:
  checkpoint: /absolute/path/to/formal/signal_simulator_best.pth
  allow_functional_fixture_checkpoint: false
